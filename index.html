<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rafita's Cake & Bakery</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <style>

    :root {
  --brown: #4b221b;
  --brown-dark: #3a1713;
  --pink: #e47d7d;
  --pink-dark: #d96d73;
  --text: #5d4741;
  --white-soft: rgba(255,255,255,0.85);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

html,
body {
  overflow-x: hidden;
  background: #fff9f8;
  color: var(--text);
}

body {
  padding-top: 90px;
}

/* NAVBAR */

.navbar-custom {
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0,0,0,0.04);
  box-shadow: 0 10px 25px rgba(0,0,0,0.04);
}

.navbar .container {
  min-height: 88px;
}

.brand-logo {
  height: 52px;
  width: auto;
  object-fit: contain;
}

.nav-link {
  color: var(--brown) !important;
  font-weight: 600;
  font-size: 0.92rem;
  padding: 10px 16px !important;
  border-radius: 999px;
  margin: 0 5px;
  transition: 0.2s ease;
}

.nav-link:hover,
.nav-link.active {
  background: linear-gradient(
    135deg,
    var(--pink),
    var(--pink-dark)
  );

  color: white !important;

  box-shadow: 0 10px 20px rgba(228,125,125,0.25);
}

.nav-divider {
  width: 1px;
  height: 35px;
  background: rgba(0,0,0,0.08);
  margin: 0 10px;
}

.cart-link {
  text-decoration: none;
  color: var(--brown);
  font-weight: 700;
  font-size: 0.9rem;

  display: flex;
  align-items: center;
  gap: 10px;
}

.cart-link i {
  font-size: 1rem;
}

.cart-badge {
  min-width: 28px;
  height: 28px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border-radius: 999px;

  background: var(--pink);
  color: white;

  font-size: 0.8rem;
  font-weight: 700;
}

/* HERO */

.hero {
  position: relative;
  min-height: calc(100vh - 90px);

  display: flex;
  align-items: center;

  overflow: hidden;

  background:
    linear-gradient(
      90deg,
      rgba(255,249,248,0.95) 0%,
      rgba(255,249,248,0.88) 30%,
      rgba(255,249,248,0.45) 55%,
      rgba(255,249,248,0.05) 100%
    ),
    url('assets/gambar/background-home.png');

  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
}

.hero-content {
  position: relative;
  z-index: 2;
  width: 100%;
}

.hero-left {
  padding: 30px 0 30px 90px;
  position: relative;

  display: flex;
  flex-direction: column;
  justify-content: center;

  min-height: calc(100vh - 90px);
}

.eyebrow {
  color: var(--pink);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;

  display: inline-flex;
  align-items: center;
  gap: 18px;

  margin-bottom: 14px;
}

.eyebrow::after {
  content: '';
  width: 85px;
  height: 1px;
  background: rgba(228,125,125,0.45);
}

.hero-logo {
  width: min(100%, 470px);
  margin-bottom: 16px;
}

.hero-divider {
  width: 300px;
  max-width: 100%;
  height: 1px;

  background: rgba(228,125,125,0.4);

  position: relative;

  margin-bottom: 20px;
}

.hero-divider::after {
  content: '♥';

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -58%);

  color: var(--pink);

  background: rgba(255,249,248,0.95);

  padding: 0 10px;
}

.hero-text {
  max-width: 500px;

  font-size: 1rem;
  line-height: 1.8;

  color: #6a514b;

  margin-bottom: 30px;
}

.btn-pink {
  border: none;

  padding: 14px 28px;

  border-radius: 14px;

  background: linear-gradient(
    135deg,
    var(--pink),
    var(--pink-dark)
  );

  color: white;
  text-decoration: none;

  display: inline-flex;
  align-items: center;
  gap: 12px;

  font-weight: 600;
  font-size: 0.95rem;

  box-shadow: 0 14px 25px rgba(228,125,125,0.28);

  transition: 0.2s ease;
}

.btn-pink:hover {
  color: white;
  transform: translateY(-2px);
}

.btn-pink i {
  font-size: 1rem;
}

/* FOOTER */

footer {
  background: linear-gradient(
    180deg,
    var(--brown),
    var(--brown-dark)
  );

  color: rgba(255,255,255,0.95);

  text-align: center;

  padding: 16px 14px;

  font-size: 0.9rem;
}

footer small {
  display: block;
  margin-top: 4px;
  color: rgba(255,255,255,0.72);

  font-size: 0.78rem;
}

/* RESPONSIVE */

@media (max-width: 991px) {

  body {
    padding-top: 82px;
  }

  .hero {
    min-height: auto;
  }

  .hero-left {
    padding: 40px 20px;
  }

  .hero-logo {
    max-width: 320px;
  }

  .hero-text {
    font-size: 0.95rem;
  }

  .nav-divider {
    display: none;
  }

}

@media (max-width: 768px) {

  .navbar .container {
    min-height: 76px;
  }

  .brand-logo {
    height: 42px;
  }

  .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.2em;
  }

  .eyebrow::after {
    width: 45px;
  }

  .hero-logo {
    max-width: 260px;
  }

  .hero-divider {
    width: 200px;
  }

  .hero-text {
    max-width: 100%;
    font-size: 0.9rem;
  }

  .btn-pink {
    width: fit-content;
    font-size: 0.9rem;
    padding: 13px 24px;
  }

}

  </style>
</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">

    <div class="container">

      <a class="navbar-brand p-0" href="index.html">

        <img
          src="assets/gambar/Logo.png"
          alt="Rafita's Cake & Bakery"
          class="brand-logo"
        >

      </a>

      <button
        class="navbar-toggler border-0 shadow-none"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav mx-auto align-items-lg-center mt-3 mt-lg-0">

          <li class="nav-item">
            <a class="nav-link active" href="index.html">
              Beranda
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="produk.html">
              Produk
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="about.html">
              Tentang
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="kontak.html">
              Kontak
            </a>
          </li>

        </ul>

        <div class="d-flex align-items-center mt-3 mt-lg-0">

          <div class="nav-divider d-none d-lg-block"></div>

          <a href="keranjang.html" class="cart-link">

            <i class="bi bi-cart3"></i>

            <span>Keranjang</span>

            <span
              id="cartBadge"
              class="cart-badge"
              style="display:none;"
            >
              0
            </span>

          </a>

        </div>

      </div>

    </div>

  </nav>

  <!-- HERO -->

  <section class="hero">

    <div class="container hero-content">

      <div class="row">

        <div class="col-lg-6 hero-left">

          <div class="eyebrow">
            Sweet Moments With
          </div>

          <img
            src="assets/gambar/Logo.png"
            alt="Rafita's Cake & Bakery"
            class="hero-logo"
          >

          <div class="hero-divider"></div>

          <p class="hero-text">
            Cake lembut, manis, dan dibuat dengan penuh cinta
            untuk setiap momen spesialmu.
          </p>

          <a href="produk.html" class="btn-pink">

            <span>Lihat Produk</span>

            <i class="bi bi-arrow-right"></i>

          </a>

        </div>

      </div>

    </div>

  </section>

  <!-- FOOTER -->

  <footer>

    © 2026 Rafita's Cake & Bakery. All Rights Reserved.

    <small>
      Fresh, sweet, and made with love.
    </small>

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    function getCart() {
      return JSON.parse(
        localStorage.getItem('rafita_cart') || '[]'
      );
    }

    function updateCartBadge() {

      const cart = getCart();

      const totalItems = cart.reduce(
        (sum, item) => sum + item.qty,
        0
      );

      const badge = document.getElementById('cartBadge');

      if (!badge) return;

      if (totalItems > 0) {

        badge.textContent = totalItems;

        badge.style.display = 'inline-flex';

      } else {

        badge.style.display = 'none';

      }

    }

    updateCartBadge();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promo | Rafita's Cake & Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --brown: #4b221b;
      --brown-dark: #3b1713;
      --pink: #e47d7d;
      --pink-dark: #d96d73;
      --text: #5f4742;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      background:
        linear-gradient(rgba(255,248,247,0.94), rgba(255,248,247,0.96)),
        url('assets/gambar/background-home.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      padding-top: 90px;
    }

    .navbar-custom {
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.04);
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
    }

    .navbar .container {
      min-height: 88px;
    }

    .brand-logo {
      height: 52px;
      width: auto;
      object-fit: contain;
    }

    .nav-link {
      color: var(--brown) !important;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 10px 16px !important;
      border-radius: 999px;
      margin: 0 5px;
      transition: 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white !important;
      box-shadow: 0 10px 20px rgba(228,125,125,0.25);
    }

    .nav-divider {
      width: 1px;
      height: 35px;
      background: rgba(0,0,0,0.08);
      margin: 0 10px;
    }

    .cart-link {
      text-decoration: none;
      color: var(--brown);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-badge {
      min-width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--pink);
      color: white;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .navbar-toggler {
      border: none;
      box-shadow: none !important;
    }

    .navbar-toggler-icon {
      width: 1.4rem;
      height: 1.4rem;
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='%234b221b' stroke-width='2.2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    .page-hero {
      padding: 60px 0 34px;
      text-align: center;
    }

    .eyebrow {
      color: var(--pink);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .page-title {
      color: var(--brown);
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .page-text {
      max-width: 700px;
      margin: auto;
      line-height: 1.8;
      color: #6a514b;
      font-size: 0.98rem;
    }

    .product-card {
      border: 1px solid rgba(228,125,125,0.18);
      border-radius: 24px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,248,247,0.94));
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 40px rgba(75,34,27,0.09);
      transition: 0.25s ease;
      height: 100%;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: rgba(228,125,125,0.35);
      box-shadow: 0 26px 55px rgba(75,34,27,0.13);
    }

    .menu-product-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 124px;
      gap: 18px;
      min-height: 206px;
      padding: 18px 16px 16px 20px;
      cursor: pointer;
    }

    .menu-product-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .menu-product-name {
      color: var(--brown);
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .menu-product-desc {
      color: #6a514b;
      font-size: 0.84rem;
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .menu-product-price,
    .modal-product-price {
      color: #111;
      font-weight: 800;
      font-size: 0.93rem;
      margin-bottom: 0;
    }

    .price-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .price-old {
      color: #777;
      font-weight: 700;
      text-decoration: line-through;
    }

    .promo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      border-radius: 999px;
      padding: 5px 12px;
      background: #ef3b4a;
      color: white;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .menu-product-media {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
    }

    .menu-product-img {
      width: 124px;
      height: 124px;
      border-radius: 16px;
      object-fit: cover;
      object-position: center;
      border: 1px solid rgba(228,125,125,0.14);
    }

    .btn-menu-add {
      border: 1px solid rgba(217,109,115,0.35);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
      font-weight: 800;
      padding: 8px 16px;
      transition: 0.2s ease;
      width: 100%;
      box-shadow: 0 12px 24px rgba(228,125,125,0.22);
    }

    .btn-menu-add:hover {
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(228,125,125,0.32);
    }

    .product-modal .modal-content {
      border: none;
      border-radius: 8px;
      overflow: visible;
      background: white;
    }

    .product-modal .modal-dialog {
      max-width: 410px;
    }

    .modal-product-close {
      position: absolute;
      right: -18px;
      top: -48px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 999px;
      background: white;
      color: #009321;
      font-size: 1.55rem;
      line-height: 1;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-product-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center;
      border-radius: 8px 8px 0 0;
    }

    .modal-product-body {
      padding: 16px 14px 16px;
    }

    .modal-product-title {
      color: #222;
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .btn-modal-cart {
      border: none;
      border-radius: 999px;
      background: #009321;
      color: white;
      font-weight: 800;
      width: 100%;
      padding: 12px 16px;
      transition: 0.2s ease;
    }

    .btn-modal-cart:hover {
      background: #007f1c;
      color: white;
    }

    .empty-category {
      border: 1px dashed rgba(228,125,125,0.35);
      border-radius: 20px;
      padding: 28px;
      color: #7a625c;
      background: rgba(255,255,255,0.62);
      text-align: center;
    }

    footer {
      margin-top: 70px;
      background: linear-gradient(180deg, var(--brown), var(--brown-dark));
      color: rgba(255,255,255,0.95);
      text-align: center;
      padding: 16px 14px;
      font-size: 0.9rem;
    }

    footer small {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,0.75);
      font-size: 0.78rem;
    }

    @media (max-width: 991px) {
      body {
        padding-top: 82px;
      }

      .nav-divider {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .brand-logo {
        height: 42px;
      }

      .page-title {
        font-size: 2rem;
      }

      .page-text {
        font-size: 0.92rem;
      }

      .menu-product-card {
        min-height: 180px;
        padding: 16px;
      }

      .modal-product-close {
        right: 8px;
        top: -46px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand p-0" href="index.html">
        <img src="assets/gambar/Logo.png" alt="Rafita's Cake & Bakery" class="brand-logo" />
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto align-items-lg-center mt-3 mt-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link active" href="promo.html">Promo</a></li>
          <li class="nav-item"><a class="nav-link" href="produk.html">Produk</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
        </ul>

        <div class="d-flex align-items-center mt-3 mt-lg-0">
          <div class="nav-divider d-none d-lg-block"></div>
          <a href="keranjang.html" class="cart-link">
            <i class="bi bi-cart3"></i>
            <span>Keranjang</span>
            <span id="cartBadge" class="cart-badge" style="display:none;">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <section class="page-hero">
    <div class="container">
      <div class="eyebrow">Special Offers</div>
      <h1 class="page-title">Promo Rafita Cakes</h1>
      <p class="page-text">Produk dengan harga spesial dari variant yang sedang promo.</p>
    </div>
  </section>

  <section class="pb-5">
    <div class="container">
      <div class="row g-4" id="promoGrid">
        <div class="col-12">
          <div class="empty-category">Memuat promo...</div>
        </div>
      </div>
    </div>
  </section>

  <div class="modal fade product-modal" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <button type="button" class="modal-product-close" data-bs-dismiss="modal" aria-label="Tutup">
          <i class="bi bi-x-lg"></i>
        </button>
        <img id="modalProductImage" class="modal-product-img" src="assets/gambar/cake-hero.png" alt="" />
        <div class="modal-product-body">
          <h3 class="modal-product-title" id="modalProductName"></h3>
          <div class="modal-product-price mb-3" id="modalProductPrice"></div>
          <label class="form-label fw-bold" for="modalProductVariant">Variant</label>
          <select class="form-select mb-3" id="modalProductVariant"></select>
          <button type="button" class="btn-modal-cart" id="modalAddButton">
            Tambah ke keranjang
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 Rafita's Cake & Bakery. All Rights Reserved.
    <small>Fresh, sweet, and made with love.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import {
      getCart,
      saveCart,
      updateCartBadge,
      loadCatalog,
      normalizeImageUrl,
      toArray
    } from './assets/js/store.js';

    let catalogProducts = {};
    let catalogVariants = {};
    let selectedProductId = null;
    let productModal = null;

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function isActive(item) {
      return item?.active !== false && item?.active !== 'false';
    }

    function formatMenuPrice(value) {
      return new Intl.NumberFormat('id-ID', {
        minimumFractionDigits: 0
      }).format(Number(value || 0));
    }

    function isPromoVariant(variant) {
      return isActive(variant) && variant?.promoActive === true && Number(variant.promoPrice || 0) > 0;
    }

    function getVariantPrice(variant) {
      return isPromoVariant(variant) ? Number(variant.promoPrice || 0) : Number(variant.price || 0);
    }

    function renderPromoPrice(variant, className = 'menu-product-price') {
      if (!variant) return '<p class="menu-product-price">Harga belum tersedia</p>';

      if (!isPromoVariant(variant)) {
        return `<p class="${className}">${formatMenuPrice(variant.price)}</p>`;
      }

      return `
        <div class="price-row">
          <span class="${className}">${formatMenuPrice(variant.promoPrice)}</span>
          <span class="price-old">${formatMenuPrice(variant.price)}</span>
          <span class="promo-badge">Promo</span>
        </div>
      `;
    }

    function getActiveVariants(productId) {
      return toArray(catalogVariants[productId] || {})
        .filter((variant) => isActive(variant))
        .sort((a, b) => Number(a.sortOrder || 0) - Number(b.sortOrder || 0));
    }

    function getBestPromoVariant(productId) {
      return getActiveVariants(productId)
        .filter((variant) => isPromoVariant(variant))
        .sort((a, b) => getVariantPrice(a) - getVariantPrice(b))[0];
    }

    function renderPromoCard(product, promoVariant) {
      const escapedId = escapeHtml(product.id);

      return `
        <div class="col-md-6 col-lg-4">
          <div class="product-card menu-product-card" role="button" tabindex="0" onclick="openProductModal('${escapedId}')">
            <div class="menu-product-info">
              <div>
                <h3 class="menu-product-name">${escapeHtml(product.name)}</h3>
                <p class="menu-product-desc">${escapeHtml(product.description || '')}</p>
                ${renderPromoPrice(promoVariant)}
              </div>
            </div>
            <div class="menu-product-media">
              <img src="${escapeHtml(normalizeImageUrl(product.imageUrl) || 'assets/gambar/cake-hero.png')}" class="menu-product-img" alt="${escapeHtml(product.name)}">
              <button class="btn-menu-add" type="button" onclick="event.stopPropagation(); openProductModal('${escapedId}')">
                Tambah
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function updateModalPrice() {
      const variantId = document.getElementById('modalProductVariant').value;
      const variant = catalogVariants[selectedProductId]?.[variantId];
      const button = document.getElementById('modalAddButton');

      if (!variant) {
        document.getElementById('modalProductPrice').textContent = 'Harga belum tersedia';
        button.textContent = 'Variant belum tersedia';
        button.disabled = true;
        return;
      }

      document.getElementById('modalProductPrice').innerHTML = renderPromoPrice(variant, 'modal-product-price');
      button.textContent = `Tambah ke keranjang - ${formatMenuPrice(getVariantPrice(variant))}`;
      button.disabled = false;
    }

    window.openProductModal = function openProductModal(productId) {
      const product = catalogProducts[productId];
      const variants = getActiveVariants(productId);
      const variantSelect = document.getElementById('modalProductVariant');

      if (!product) {
        alert('Produk belum tersedia.');
        return;
      }

      selectedProductId = productId;
      document.getElementById('modalProductImage').src = normalizeImageUrl(product.imageUrl) || 'assets/gambar/cake-hero.png';
      document.getElementById('modalProductImage').alt = product.name || '';
      document.getElementById('modalProductName').textContent = product.name || '';

      variantSelect.innerHTML = variants.length
        ? variants.map((variant) => `
            <option value="${escapeHtml(variant.id)}" ${isPromoVariant(variant) ? 'selected' : ''}>
              ${escapeHtml(variant.name)} - ${formatMenuPrice(getVariantPrice(variant))}
            </option>
          `).join('')
        : '<option value="">Belum ada variant</option>';
      variantSelect.disabled = !variants.length;

      updateModalPrice();

      if (!productModal) {
        productModal = new bootstrap.Modal(document.getElementById('productModal'));
      }

      productModal.show();
    };

    function addToCart(productId, variantId) {
      const product = catalogProducts[productId];
      const variant = catalogVariants[productId]?.[variantId];

      if (!product || !variant) {
        alert('Produk atau variant belum tersedia.');
        return;
      }

      const cartId = `${productId}:${variantId}`;
      const cart = getCart();
      const foundIndex = cart.findIndex((item) => item.id === cartId);

      if (foundIndex > -1) {
        cart[foundIndex].qty += 1;
      } else {
        cart.push({
          id: cartId,
          productId,
          variantId,
          name: product.name,
          variantName: variant.name,
          price: getVariantPrice(variant),
          originalPrice: Number(variant.price || 0),
          promoActive: isPromoVariant(variant),
          image: normalizeImageUrl(product.imageUrl) || 'assets/gambar/cake-hero.png',
          qty: 1
        });
      }

      saveCart(cart);
      updateCartBadge();
      if (productModal) productModal.hide();
    }

    async function renderPromo() {
      const grid = document.getElementById('promoGrid');

      try {
        const catalog = await loadCatalog();
        catalogProducts = catalog.products;
        catalogVariants = catalog.productVariants;

        const promoProducts = toArray(catalog.products)
          .filter((product) => isActive(product) && getBestPromoVariant(product.id))
          .sort((a, b) => Number(a.sortOrder || 0) - Number(b.sortOrder || 0));

        if (!promoProducts.length) {
          grid.innerHTML = `
            <div class="col-12">
              <div class="empty-category">Belum ada produk promo.</div>
            </div>
          `;
          return;
        }

        grid.innerHTML = promoProducts
          .map((product) => renderPromoCard(product, getBestPromoVariant(product.id)))
          .join('');
      } catch (error) {
        console.error(error);
        grid.innerHTML = `
          <div class="col-12">
            <div class="empty-category">Promo belum bisa dimuat dari Firebase.</div>
          </div>
        `;
      }
    }

    document.getElementById('modalProductVariant').addEventListener('change', updateModalPrice);
    document.getElementById('modalAddButton').addEventListener('click', () => {
      const variantId = document.getElementById('modalProductVariant').value;
      addToCart(selectedProductId, variantId);
    });

    renderPromo();
    updateCartBadge();
  </script>
</body>
</html>
